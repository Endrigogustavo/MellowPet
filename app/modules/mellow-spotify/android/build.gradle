plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mellowpet.spotify'
version = '1.0.0'

android {
  namespace "com.mellowpet.spotify"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  // AARs baixados manualmente de github.com/spotify/android-sdk/releases —
  // não publicados em nenhum repositório Maven público. O AGP recusa
  // dependencia de arquivo .aar local direto num modulo de biblioteca ("would
  // produce a broken AAR"), entao viram um repositorio Maven local minimo em
  // vez de files()/flatDir.
  maven { url uri('libs-repo') }
}

dependencies {
  implementation 'com.spotify.android:app-remote:0.8.0'
}
