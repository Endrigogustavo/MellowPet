<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1422" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>MellowPet</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #FAF6F2;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #1C1422;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      input,
      textarea,
      select {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript para abrir o MellowPet.</noscript>
    <div id="root"></div>
  </body>
</html>
