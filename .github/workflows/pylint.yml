name: API

on:
  push:
  pull_request:

jobs:
  test:
    name: Testes e lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11/3.12 espelham o runtime: o Dockerfile usa python:3.12-slim e o
        # codigo usa sintaxe de union (`str | None`), que exige 3.10+.
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        # Só as de dev: os testes de config e segurança não precisam de
        # TensorFlow/DeepFace, e instalá-los levaria vários minutos por job.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes
        run: pytest

      - name: Lint (apenas erros reais)
        # --errors-only mantém o CI focado em defeito, não em estilo.
        # Limitado aos módulos cujas dependências estão instaladas aqui
        # (mediapipe/onnxruntime ficam fora do job de teste).
        # --generated-members=cv2.*: o OpenCV monta a API em tempo de execução
        # e o pylint reporta "no-member" para toda ela. O allow-list de
        # extensão não resolve; generated-members sim.
        run: |
          pylint --errors-only --generated-members="cv2.*" \
            config.py utils/security.py utils/logger.py \
            services/emotion/util.py services/emotion/mapping.py \
            services/emotion/fusion.py services/emotion/frames.py

      - name: Checar sintaxe de todos os módulos
        # Pega qualquer arquivo que não compile, inclusive os que o job de
        # teste não importa.
        run: python -m compileall -q config.py main.py routers services utils scripts tests

  brand:
    name: Assets de marca em dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

        # Versão fixada: o Pillow pode rasterizar com pequenas diferenças entre
        # versões, e a comparação abaixo é byte a byte.
      - run: pip install -r brand/requirements.txt

      # Regera os assets e falha se o resultado diferir do que está versionado —
      # impede que alguém edite um PNG à mão e ele saia de sincronia com a
      # geometria em brand/mellow_mark.py.
      - name: Regerar e comparar
        run: |
          python brand/generate_assets.py
          if ! git diff --quiet -- app/assets; then
            echo "::error::app/assets está fora de sincronia com brand/mellow_mark.py."
            echo "Rode: python brand/generate_assets.py"
            git diff --stat -- app/assets
            exit 1
          fi
